<style>
:root{--bg:#ead6de;--fg:#09090b;--card:#ffffff;--blk:#111827;--ac:#be185d;--mu:#3f3f46;--bd:#cdb3bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:12px 16px;max-width:560px;margin:auto}
h1{margin:2px 0 12px;padding:0 10px;height:78px;background:#000;border-radius:12px;overflow:hidden;border:2px solid var(--blk);border-bottom:3px solid #ec4899;box-shadow:0 3px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
h1 .logo-circle{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#000;border:1.5px solid #fbcfe8;flex-shrink:0;z-index:2}
h1 .banner-wrap{flex:1;min-width:0;height:100%;display:block}
h1 .banner-img{width:100%;height:100%;object-fit:cover;object-position:center 48%;display:block;background:#000}
@media (min-width:480px){h1{height:84px;padding:0 14px;gap:10px}h1 .logo-circle{width:62px;height:62px}h1 .banner-img{object-fit:fill}}
input,select{padding:12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font-size:16px;font-weight:500;width:100%;box-sizing:border-box;margin:6px 0}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;margin-top:6px;cursor:pointer}
.msg{color:var(--mu);font-size:14px;min-height:18px;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--fg);font-weight:700;font-size:14px;margin-bottom:10px;background:var(--card);padding:10px 12px;border-radius:8px;border:1px solid var(--bd)}
.top .acciones{display:flex;gap:8px;align-items:center;flex-shrink:0}
.top .sm{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;text-decoration:none;line-height:1.2}
.top .sm[hidden]{display:none !important}
.total{background:var(--blk);color:#fff;border-radius:10px;padding:14px;text-align:center;font-size:34px;font-weight:700;border-bottom:4px solid #ec4899}
.total small{display:block;font-size:13px;font-weight:400;opacity:.85}
.pago{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:15px;font-weight:600}
.pago select{margin:0;width:auto;flex:1}
#mic{width:100%;margin:12px 0;padding:14px;font-size:16px;font-weight:700;border-radius:8px;background:var(--card);color:var(--fg);border:2px solid var(--blk);cursor:pointer}
#mic.wait{border-color:var(--ac);background:#fce7f3;color:#9d174d}
#mic.on{border-color:#15803d;background:#dcfce7;color:#14532d}
#heard{min-height:20px;color:var(--fg);font-weight:500;font-size:14px;text-align:center;margin-bottom:8px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick input{flex:3;width:auto;margin:0}
.quick button,.sm{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--blk);background:var(--card);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;box-sizing:border-box}
.quick button:hover,.sm:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
#rapidos button{flex:1 1 45%}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font-size:14px;font-weight:700;cursor:pointer}
nav button.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#list,#list .card,#list .card *{-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none !important}
#list .vh>b,#list .ln,#list .ln *{pointer-events:none}
.card[data-card-vid]{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card.pressing{border-color:#b91c1c;background:#fff1f2;transform:scale(0.99)}
.card.pressing::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:#b91c1c;animation:holdfill 1.3s linear forwards}
@keyframes holdfill{from{width:0}to{width:100%}}
.card.anul{opacity:.5}
.anul-bar{margin-top:8px;padding-top:8px;border-top:1.5px dashed #fca5a5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#b91c1c}
.anul-bar[hidden]{display:none !important}
.anul-bar .btn-anular-item{flex:0 0 auto;background:#b91c1c;color:#fff;border-color:#b91c1c;padding:6px 12px}
.anul-bar .btn-cancel-anular{flex:0 0 auto;padding:6px 10px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;font-size:14px;color:var(--fg)}
.mp-sel{width:auto;margin:0;padding:4px 8px;font-size:13px;font-weight:700;border-radius:6px;border:1.5px solid var(--ac);background:#fdf2f8;color:var(--ac);cursor:pointer;pointer-events:auto}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kpi div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--blk);border-radius:10px;padding:10px}.kpi b{display:block;font-size:20px;color:var(--ac)}.kpi small{color:var(--mu);font-weight:600}
.card h3{margin:0 0 6px;font-size:15px;color:var(--blk)}
.br{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.br span{width:96px;color:var(--fg);font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.br i{display:block;height:14px;background:var(--ac);border-radius:4px;min-width:2px}.br div{flex:1}.br b{min-width:60px;text-align:right;color:var(--blk)}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;color:var(--blk);gap:8px}
.ln{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--mu)}
.vacio{text-align:center;color:var(--mu);font-weight:500}
.h-filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.h-filtros button{flex:1;min-width:80px;padding:8px 8px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer}
.h-filtros button.a{background:var(--blk);color:#fff;border-color:var(--blk)}
.cat-box{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:8px;background:#faf7f9}
.cat-box.c-comida{border-left:4px solid #be185d;background:#fdf2f8}
.cat-box.c-bebida{border-left:4px solid #0284c7;background:#f0f9ff}
.cat-box.c-cerveza{border-left:4px solid #d97706;background:#fffbeb}
.cat-box.c-otro{border-left:4px solid #4b5563;background:#f9fafb}
.cat-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--blk);padding-bottom:4px;margin-bottom:4px;border-bottom:1px solid rgba(0,0,0,.08)}
.cat-head small{font-weight:600;color:var(--mu);margin-left:4px}
.mp-badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mp-pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:#f4f4f5;border:1px solid var(--bd);color:var(--fg)}
.mp-pill b{color:var(--ac)}
.prop-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#e4e4e7;margin:6px 0}
.sub-det{margin-top:8px;background:#fff;border:1px dashed var(--bd);border-radius:8px;padding:6px 10px}
.sub-det summary{font-size:12px;color:var(--ac);font-weight:700}
</style></head><body>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'S/ ' + Number(n).toFixed(2);
const LIMA = { timeZone: 'America/Lima' };
const hoyStr = () => new Date().toLocaleDateString('en-CA', LIMA);
const diasAtras = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString('en-CA', LIMA); };
const horaStr = iso => new Date(iso).toLocaleTimeString('es-PE', { ...LIMA, hour: '2-digit', minute: '2-digit' });
const fdate = f => new Date(f + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'short', day: 'numeric', month: 'short' });
const CATEG = { chicharron: 'Chicharrón', sarza: 'Sarza', combinado: 'Combinados', bebida: 'Bebidas', cerveza: 'Cervezas', otro: 'Otros' };
const METODOS = { efectivo: 'Efectivo', yape: 'Yape', plin: 'Plin', tarjeta: 'Tarjeta', transferencia: 'Transferencia' };

let sb = null, CAT = [], HOY = [], HIST = [], ingresando = false;

/* ---------- Sonidos ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type, g) { const a = ac(); if (!a) return; const o = a.createOscillator(), v = a.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(v); v.connect(a.destination); const s = a.currentTime + t0; v.gain.setValueAtTime(0.0001, s); v.gain.exponentialRampToValueAtTime(g || 0.5, s + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, s + d); o.start(s); o.stop(s + d + 0.02); }
function snd(k) { try {
  if (k === 'ok') { tone(880, 0, .1, 'square', .3); tone(1320, .11, .18, 'square', .3); navigator.vibrate && navigator.vibrate(60); }
  else if (k === 'err') { tone(200, 0, .3, 'sawtooth', .35); tone(150, .32, .3, 'sawtooth', .35); navigator.vibrate && navigator.vibrate([120, 60, 120]); }
  else if (k === 'on') { tone(660, 0, .1, 'sine', .5); tone(880, .11, .1, 'sine', .5); tone(1100, .22, .14, 'sine', .5); }
  else if (k === 'off') { tone(880, 0, .1, 'sine', .5); tone(660, .11, .1, 'sine', .5); tone(440, .22, .14, 'sine', .5); }
} catch (e) {} }

/* ---------- Login ---------- */
function setMsg(t) { $('loginMsg').textContent = t; }
function mostrarLogin() { $('app').hidden = true; $('login').hidden = false; }

async function entrar() {
  if (ingresando) return;
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || !password) { setMsg('Escribe tu correo y contraseña.'); return; }
  ingresando = true;
  setMsg('Ingresando…');
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { setMsg('No se pudo ingresar: ' + error.message); return; }
    await iniciarApp(data && data.user);
  } catch (e) {
    setMsg('Error de conexión: ' + (e.message || e));
  } finally {
    ingresando = false;
  }
}

async function cargarCarta() {
  let { data, error } = await sb.from('productos')
    .select('id,nombre,categoria,precio,controla_stock,stock,stock_minimo')
    .eq('activo', true).order('orden');
  if (error) {
    const r2 = await sb.from('productos').select('id,nombre,categoria,precio').eq('activo', true).order('orden');
    data = r2.data; error = r2.error;
  }
  if (error) { $('heard').textContent = 'Error cargando la carta: ' + error.message; return false; }
  CAT = data || [];
  return true;
}

async function iniciarApp(u) {
  const nombre = (u && u.user_metadata && u.user_metadata.nombre) || 'Nerida Vasquez';
  $('quien').textContent = nombre;
  $('linkAdmin').hidden = true;
  $('login').hidden = true; $('app').hidden = false;
  try {
    const { data: esAdm } = await sb.rpc('es_admin');
    $('linkAdmin').hidden = !esAdm;
  } catch (e) {}
  if (!(await cargarCarta())) return;
  pintarRapidos();
  await cargarHoy();
  iniciarVoz();
}

async function init() {
  $('entrar').onclick = entrar;
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); entrar(); } });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('pass').focus(); } });
  if (CONFIG.url.includes('TU-PROYECTO') || typeof supabase === 'undefined') {
    $('login').hidden = false;
    setMsg('Falta configurar Supabase: revisa CONFIG en index.html (o no hay conexión a internet).');
    return;
  }
  sb = supabase.createClient(CONFIG.url, CONFIG.key);
  $('login').hidden = false;
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await iniciarApp(data.session.user);
  } catch (e) {}
}

$('salir').onclick = async () => { if (sb) await sb.auth.signOut(); location.reload(); };

/* ---------- Ventas ---------- */
async function cargarHoy() {
  const { data, error } = await sb.from('ventas')
    .select('id,hora,metodo_pago,total,estado,venta_detalles(cantidad,precio_unitario,productos(nombre,categoria))')
    .eq('fecha', hoyStr()).order('hora', { ascending: false });
  if (error) { $('heard').textContent = 'Error leyendo ventas: ' + error.message; return; }
  HOY = data; pintarHoy();
}

function pintarHoy() {
  const tot = HOY.filter(v => v.estado === 'valida').reduce((s, v) => s + Number(v.total), 0);
  $('tot').textContent = money(tot);
  $('list').innerHTML = HOY.length ? HOY.map(v => {
    const controlMetodo = v.estado === 'valida'
      ? `<select class="mp-sel" data-vid="${v.id}" title="Cambiar método de pago">${Object.entries(METODOS).map(([k, lbl]) => `<option value="${k}"${v.metodo_pago === k ? ' selected' : ''}>${esc(lbl)}</option>`).join('')}</select>`
      : `<span>${esc(METODOS[v.metodo_pago] || v.metodo_pago)} · ANULADA</span>`;
    const barraAnular = v.estado === 'valida'
      ? `<div class="anul-bar" hidden>
           <span>¿Anular venta de ${horaStr(v.hora)} (${money(v.total)})?</span>
           <div style="display:flex;gap:6px">
             <button type="button" class="sm btn-anular-item" data-anular-id="${v.id}">Anular venta</button>
             <button type="button" class="sm btn-cancel-anular">Cancelar</button>
           </div>
         </div>`
      : '';
    return `
    <div class="card ${v.estado === 'anulada' ? 'anul' : ''}" ${v.estado === 'valida' ? `data-card-vid="${v.id}"` : ''}>
      <div class="vh"><b>${horaStr(v.hora)}</b>${controlMetodo}<b>${money(v.total)}</b></div>
      ${v.venta_detalles.map(d => `<div class="ln"><span>${d.cantidad} × ${esc(d.productos.nombre)}</span><span>${money(d.cantidad * d.precio_unitario)}</span></div>`).join('')}
      ${barraAnular}
    </div>`;
  }).join('') : '<p class="vacio">Aún no hay ventas hoy.</p>';
  if (!$('cierreBox').hidden) pintarCierreHoy();
}

async function anularVentaPorId(vid) {
  const v = HOY.find(x => x.id === Number(vid));
  const { error } = await sb.from('ventas').update({ estado: 'anulada' }).eq('id', Number(vid));
  if (error) { $('heard').textContent = 'No se pudo anular: ' + error.message; snd('err'); return; }
  $('heard').textContent = `Venta${v ? ' de las ' + horaStr(v.hora) + ' (' + money(v.total) + ')' : ''} anulada (el stock descontado fue devuelto).`;
  snd('ok');
  await cargarCarta();
  await cargarHoy();
}

let pressTimer = null, pressCard = null, pressX = 0, pressY = 0, pressMoved = false;
function limpiarPress() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (pressCard) { pressCard.classList.remove('pressing'); pressCard = null; }
}
function mostrarBarraAnular(card) {
  if (!card) return;
  card.classList.remove('pressing');
  $('list').querySelectorAll('.anul-bar').forEach(b => { b.hidden = true; });
  const bar = card.querySelector('.anul-bar');
  if (bar) {
    bar.hidden = false;
    try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) {}
    snd('off');
  }
  pressTimer = null;
  pressCard = null;
}
function iniciarPress(e, x, y) {
  if (e.target.closest('select, button, .anul-bar')) return;
  const card = e.target.closest('.card[data-card-vid]');
  if (!card) return;
  limpiarPress();
  pressCard = card;
  pressX = x;
  pressY = y;
  pressMoved = false;
  card.classList.add('pressing');
  pressTimer = setTimeout(() => mostrarBarraAnular(card), 1300);
}

$('list').addEventListener('selectstart', e => e.preventDefault());
$('list').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  iniciarPress(e, e.clientX, e.clientY);
});
$('list').addEventListener('mousemove', e => {
  if (!pressTimer) return;
  if (Math.abs(e.clientX - pressX) > 20 || Math.abs(e.clientY - pressY) > 20) { pressMoved = true; limpiarPress(); }
});
window.addEventListener('mouseup', limpiarPress);

$('list').addEventListener('touchstart', e => {
  const t = e.touches && e.touches[0];
  if (!t) return;
  iniciarPress(e, t.clientX, t.clientY);

function porMetodo(vs) {
  const m = { efectivo: 0, yape: 0, plin: 0, tarjeta: 0, transferencia: 0 };
  vs.forEach(v => { m[v.metodo_pago] = (m[v.metodo_pago] || 0) + Number(v.total); });
  return m;
}

const DEFINICION_BLOQUES = [
  { key: 'comida',  titulo: 'Chicharrones, Combinados y Sarza', cls: 'c-comida',  color: '#be185d', cats: ['chicharron', 'combinado', 'sarza'] },
  { key: 'bebida',  titulo: 'Gaseosas, Chicha y Bebidas',       cls: 'c-bebida',  color: '#0284c7', cats: ['bebida'] },
  { key: 'cerveza', titulo: 'Cervezas',                         cls: 'c-cerveza', color: '#d97706', cats: ['cerveza'] },
  { key: 'otro',    titulo: 'Otros productos',                  cls: 'c-otro',    color: '#4b5563', cats: ['otro'] }
];

function catDeDetalle(d) {
  if (d.productos && d.productos.categoria) return d.productos.categoria;
  const p = CAT.find(x => x.nombre === (d.productos && d.productos.nombre));
  return (p && p.categoria) || 'otro';
}

function agruparPorBloques(vs) {
  const mapa = {};
  DEFINICION_BLOQUES.forEach(b => { mapa[b.key] = { ...b, unidades: 0, subtotal: 0, prods: {} }; });
  vs.forEach(v => (v.venta_detalles || []).forEach(d => {
    const c = catDeDetalle(d);
    const blk = DEFINICION_BLOQUES.find(b => b.cats.includes(c)) || DEFINICION_BLOQUES[3];
    const g = mapa[blk.key];
    const n = (d.productos && d.productos.nombre) || 'Producto';
    const sub = Number(d.cantidad) * Number(d.precio_unitario);
    g.unidades += Number(d.cantidad);
    g.subtotal += sub;
    if (!g.prods[n]) g.prods[n] = { q: 0, s: 0 };
    g.prods[n].q += Number(d.cantidad);
    g.prods[n].s += sub;
  }));
  return DEFINICION_BLOQUES.map(b => {
    const g = mapa[b.key];
    g.lista = Object.entries(g.prods).sort((a, x) => x[1].s - a[1].s);
    return g;
  });
}

function htmlBloquesCategoria(vs, totDia) {
  const bloques = agruparPorBloques(vs).filter(b => b.unidades > 0);
  if (!bloques.length) return '<p class="vacio" style="margin:6px 0">Sin productos registrados.</p>';
  const barra = totDia > 0 && bloques.length > 1
    ? `<div class="prop-bar" title="Proporción por categoría">${bloques.map(b => `<div style="width:${Math.max(3, Math.round(b.subtotal / totDia * 100))}%;background:${b.color}"></div>`).join('')}</div>`
    : '';
  return barra + bloques.map(b => {
    const pct = totDia > 0 ? Math.round(b.subtotal / totDia * 100) : 0;
    return `
      <div class="cat-box ${b.cls}">
        <div class="cat-head">
          <span>${esc(b.titulo)} <small>(${b.unidades} u.)</small></span>
          <span>${money(b.subtotal)} <small>${pct}%</small></span>
        </div>
        ${b.lista.map(([n, o]) => `<div class="ln" style="color:var(--fg)"><span><b>${o.q}</b> × ${esc(n)}</span><span>${money(o.s)}</span></div>`).join('')}
      </div>`;
  }).join('');
}

function textoResumenDia(fechaStr, vs) {
  const tot = vs.reduce((s, v) => s + Number(v.total), 0);
  const pm = porMetodo(vs);
  const bloques = agruparPorBloques(vs).filter(b => b.unidades > 0);
  const lineas = [
    `RESUMEN LA FLAQUITA - ${fdate(fechaStr).toUpperCase()} (${fechaStr})`,
    `Ventas válidas: ${vs.length} | Total: ${money(tot)}`,
    ''
  ];
  lineas.push('MÉTODOS DE PAGO:');
  Object.entries(pm).filter(([, val]) => val > 0).forEach(([k, val]) => {
    lineas.push(`- ${METODOS[k] || k}: ${money(val)}`);
  });
  bloques.forEach(b => {
    lineas.push('');
    lineas.push(`${b.titulo.toUpperCase()} (${b.unidades} u. · ${money(b.subtotal)}):`);
    b.lista.forEach(([n, o]) => {
      lineas.push(`- ${o.q} x ${n}: ${money(o.s)}`);
    });
  });
  return lineas.join('\n');
}

}

let ultimaVentaId = null, ultimaVentaTs = 0;

async function guardar(items, rejects, metodoVoz) {
  const detalles = items.map(it => {
    const p = CAT.find(x => x.nombre === it.name);
    return p ? { producto_id: p.id, cantidad: it.q, precio_unitario: it.price } : null;
  }).filter(Boolean);
  if (!detalles.length) { $('heard').textContent = 'No se anotó nada' + (rejects.length ? ': ' + rejects.join(', ') : ''); snd('err'); return; }
  const metodoUsado = metodoVoz || $('metodo').value;
  try {
    const { data: id, error } = await sb.rpc('registrar_venta', { p_items: detalles, p_metodo_pago: metodoUsado, p_canal: 'local' });
    if (error) throw error;
    ultimaVentaId = id;
    ultimaVentaTs = Date.now();
    await cargarCarta();
    const avisosStock = [];
    const vistos = new Set();
    for (const it of items) {
      if (vistos.has(it.name)) continue;
      vistos.add(it.name);
      const p = CAT.find(x => x.nombre === it.name);
      if (p && p.controla_stock) {
        if (p.stock <= 0) avisosStock.push(`Sin stock de ${p.nombre} (queda ${p.stock})`);
        else if (p.stock <= (p.stock_minimo || 0)) avisosStock.push(`Stock bajo de ${p.nombre} (quedan ${p.stock})`);
      }
    }
    const resumen = items.map(i => `${i.q}× ${i.name} (${money(i.q * i.price)})`).join(', ');
    $('heard').textContent = `Venta #${id} (${METODOS[metodoUsado] || metodoUsado}): ${resumen}`
      + (avisosStock.length ? ' · Aviso: ' + avisosStock.join(', ') : '')
      + (rejects.length ? ` · No anoté: ${rejects.join(', ')}` : '');
    snd(rejects.length ? 'err' : 'ok');
    await cargarHoy();
  } catch (e) {
    $('heard').textContent = 'No se guardó: ' + e.message;
    snd('err');
  }
}

async function anotar(txt) {
  const r = FlaquitaParser.parseVenta(txt, CAT);
  if (!r.items.length) {
    if (r.metodo && !r.rejects.length) {
      if (ultimaVentaId && Date.now() - ultimaVentaTs < 25000) {
        const { error } = await sb.from('ventas').update({ metodo_pago: r.metodo }).eq('id', ultimaVentaId);
        if (!error) {
          $('heard').textContent = `Venta #${ultimaVentaId} cambiada a pago con ${METODOS[r.metodo] || r.metodo}.`;
          snd('ok');
          await cargarHoy();
          return;
        }
      }
      $('metodo').value = r.metodo;
      $('heard').textContent = `Método de pago seleccionado: ${METODOS[r.metodo] || r.metodo}.`;
      snd('ok');
      return;
    }
    $('heard').textContent = 'No entendí: "' + txt + '"' + (r.rejects.length ? ' · ' + r.rejects.join(', ') : '');
    snd('err');
    return;
  }
  return guardar(r.items, r.rejects, r.metodo);
}

/* ---------- Historial y dashboard ---------- */
let filtroHistPeriodo = '30', filtroHistFecha = '';

async function cargarHist() {
  const { data, error } = await sb.from('ventas')
    .select('id,fecha,hora,total,estado,metodo_pago,venta_detalles(cantidad,precio_unitario,productos(nombre,categoria))')
    .gte('fecha', diasAtras(365)).order('hora', { ascending: false });
  if (error) throw error;
  HIST = data.filter(v => v.estado === 'valida');
}

function grupo(vs) {
  const m = {};
  vs.forEach(v => v.venta_detalles.forEach(d => {
    const n = d.productos.nombre, o = m[n] || (m[n] = { q: 0, s: 0 });
    o.q += d.cantidad; o.s += d.cantidad * d.precio_unitario;
  }));
  return m;
}

function pintarVistaHist() {
  const hoy = hoyStr();
  const inicioMes = hoy.slice(0, 8) + '01';
  const minFecha = filtroHistPeriodo === '7' ? diasAtras(6)
    : filtroHistPeriodo === '30' ? diasAtras(29)
    : filtroHistPeriodo === 'mes' ? inicioMes
    : '0000-00-00';

  const filtradas = HIST.filter(v => {
    if (filtroHistFecha) return v.fecha === filtroHistFecha;
    return v.fecha >= minFecha;
  });

  const porDia = {};
  filtradas.forEach(v => (porDia[v.fecha] = porDia[v.fecha] || []).push(v));
  const dias = Object.keys(porDia).sort().reverse();

  const diasHtml = dias.length ? dias.map(f => {
    const vs = porDia[f];
    const tot = vs.reduce((s, v) => s + Number(v.total), 0);
    const pm = porMetodo(vs);
    const bloquesDia = agruparPorBloques(vs);
    const dComida  = bloquesDia.find(b => b.key === 'comida');
    const dBebida  = bloquesDia.find(b => b.key === 'bebida');
    const dCerveza = bloquesDia.find(b => b.key === 'cerveza');
    const horas = vs.map(v => horaStr(v.hora));
    const rangoHora = horas.length > 1 ? `${horas[horas.length - 1]} – ${horas[0]}` : (horas[0] || '');
    const desglosePago = Object.entries(pm)
      .filter(([, val]) => val > 0)
      .map(([k, val]) => `<span class="mp-pill">${esc(METODOS[k] || k)}: <b>${money(val)}</b></span>`)
      .join('');

    const listaHoras = vs.map(v => {
      const desc = (v.venta_detalles || []).map(d => `${d.cantidad}× ${esc(d.productos.nombre)}`).join(', ');
      return `<div class="ln" style="border-bottom:1px solid #f4f4f5;padding:4px 0;gap:6px">
        <span style="color:var(--fg)"><b>${horaStr(v.hora)}</b> · <small style="color:var(--ac);font-weight:700">${esc(METODOS[v.metodo_pago] || v.metodo_pago)}</small> · ${desc}</span>
        <b style="color:var(--blk);white-space:nowrap">${money(v.total)}</b>
      </div>`;
    }).join('');

    return `<details>
      <summary>
        <div>
          <span style="font-size:15px">${fdate(f)}</span>
          <small style="display:block;font-size:12px;color:var(--mu);font-weight:500">${vs.length} ${vs.length === 1 ? 'venta' : 'ventas'}${rangoHora ? ' · ' + rangoHora : ''}</small>
        </div>
        <span style="font-size:16px;color:var(--ac)">${money(tot)}</span>
      </summary>
      <div style="padding-top:8px;margin-top:8px;border-top:1px solid var(--bd)">
        <div class="kpi" style="margin-bottom:8px">
          <div style="border-left-color:var(--blk)"><small>Total del día</small><b>${money(tot)}</b><small>${vs.length} ventas · Prom. ${money(tot / vs.length)}</small></div>
          <div style="border-left-color:#be185d"><small>Chicharrones y Platos</small><b style="color:#be185d">${money(dComida ? dComida.subtotal : 0)}</b><small>${dComida ? dComida.unidades : 0} porciones/platos</small></div>
          <div style="border-left-color:#0284c7"><small>Gaseosas y Bebidas</small><b style="color:#0284c7">${money(dBebida ? dBebida.subtotal : 0)}</b><small>${dBebida ? dBebida.unidades : 0} unidades</small></div>
          <div style="border-left-color:#d97706"><small>Cervezas</small><b style="color:#d97706">${money(dCerveza ? dCerveza.subtotal : 0)}</b><small>${dCerveza ? dCerveza.unidades : 0} botellas</small></div>
        </div>
        <div class="mp-badges">${desglosePago}</div>
        ${htmlBloquesCategoria(vs, tot)}
        <details class="sub-det">
          <summary><span>Ver las ${vs.length} ventas del día hora por hora</span><span>Detalle</span></summary>
          <div style="margin-top:6px">${listaHoras}</div>
        </details>
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <button type="button" class="sm btn-copiar-dia" data-fecha="${f}" style="flex:0 0 auto;padding:6px 12px;font-size:12px">Copiar resumen del ${fdate(f)}</button>
        </div>
      </div>
    </details>`;
  }).join('') : '<p class="vacio">No hay ventas registradas en este período.</p>';

  $('v-hist').innerHTML = `
    <div class="h-filtros">
      <button type="button" data-hp="7" class="${!filtroHistFecha && filtroHistPeriodo === '7' ? 'a' : ''}">Últimos 7 días</button>
      <button type="button" data-hp="30" class="${!filtroHistFecha && filtroHistPeriodo === '30' ? 'a' : ''}">30 días</button>
      <button type="button" data-hp="mes" class="${!filtroHistFecha && filtroHistPeriodo === 'mes' ? 'a' : ''}">Este mes</button>
      <button type="button" data-hp="todo" class="${!filtroHistFecha && filtroHistPeriodo === 'todo' ? 'a' : ''}">Todo</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <input type="date" id="histFechaInput" value="${esc(filtroHistFecha)}" style="margin:0;padding:8px 10px;font-size:14px;flex:1" title="Buscar un día específico">
      ${filtroHistFecha ? '<button type="button" class="sm" id="limpiarFechaHist" style="flex:0 0 auto;padding:8px 12px">Ver todos</button>' : ''}
    </div>
    ${diasHtml}
    <button class="sm" id="exp" style="width:100%;margin-top:10px">Descargar todo en Excel (CSV)</button>
  `;
}

function exportar() {
  const filas = ['fecha,hora,metodo_pago,categoria,producto,cantidad,precio_unitario,subtotal'];
  HIST.forEach(v => v.venta_detalles.forEach(d => filas.push([v.fecha, horaStr(v.hora), v.metodo_pago, '"' + (CATEG[d.productos.categoria] || d.productos.categoria || '') + '"', '"' + d.productos.nombre + '"', d.cantidad, d.precio_unitario, d.cantidad * d.precio_unitario].join(','))));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([filas.join('\n')], { type: 'text/csv' }));
  a.download = 'ventas-la-flaquita.csv'; a.click();
}

async function rDash() {
  $('v-dash').innerHTML = '<p class="vacio">Cargando…</p>';
  try { await cargarHist(); } catch (e) { $('v-dash').innerHTML = '<p class="vacio">Error: ' + esc(e.message) + '</p>'; return; }
  if (!HIST.length) { $('v-dash').innerHTML = '<p class="vacio">El dashboard aparece cuando tengas ventas.</p>'; return; }

  const porDia = {};
  HIST.forEach(v => porDia[v.fecha] = (porDia[v.fecha] || 0) + Number(v.total));
  const ks = Object.keys(porDia).sort();
  const T = Object.values(porDia).reduce((a, b) => a + b, 0);
  const mejor = ks.reduce((a, k) => porDia[k] > porDia[a] ? k : a, ks[0]);
  const l7 = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); const f = d.toLocaleDateString('en-CA', LIMA); return [f, porDia[f] || 0]; });

  const cat = {}, prods = {};
  HIST.forEach(v => v.venta_detalles.forEach(d => {
    const c = d.productos.categoria, n = d.productos.nombre;
    cat[c] = (cat[c] || 0) + d.cantidad * d.precio_unitario;
    prods[n] = (prods[n] || 0) + d.cantidad;
  }));
  const top = Object.entries(prods).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const bars = (rows, mx) => rows.map(([l, v, t]) => `<div class="br"><span>${esc(l)}</span><div><i style="width:${mx ? Math.round(v / mx * 100) : 0}%"></i></div><b>${t}</b></div>`).join('');
  const mx7 = Math.max(1, ...l7.map(x => x[1])), mxC = Math.max(1, ...Object.values(cat)), mxP = top.length ? top[0][1] : 1;

  $('v-dash').innerHTML = `
    <div class="kpi">
      <div><small>Total acumulado</small><b>${money(T)}</b></div>
      <div><small>Promedio por día</small><b>${money(T / ks.length)}</b></div>
      <div><small>Días con ventas</small><b>${ks.length}</b></div>
      <div><small>Mejor día</small><b>${money(porDia[mejor])}</b><small>${fdate(mejor)}</small></div>
    </div>
    <div class="card"><h3>Últimos 7 días</h3>${bars(l7.map(([f, v]) => [fdate(f).split(',')[0] + ' ' + f.slice(8), v, money(v)]), mx7)}</div>
    <div class="card"><h3>Ventas por tipo</h3>${bars(Object.entries(cat).map(([c, v]) => [CATEG[c] || c, v, Math.round(v / T * 100) + '%']), mxC)}</div>
    <div class="card"><h3>Lo más vendido (unidades)</h3>${bars(top.map(([n, q]) => [n, q, q + ' u']), mxP)}</div>`;
}

function show(v) {
  ['hoy', 'hist', 'dash'].forEach(k => { $('v-' + k).hidden = k !== v; $('t-' + k).classList.toggle('a', k === v); });
  if (v === 'hoy') cargarHoy();
  if (v === 'hist') rHist();
  if (v === 'dash') rDash();
}
$('t-hoy').onclick = () => show('hoy');
$('t-hist').onclick = () => show('hist');
$('t-dash').onclick = () => show('dash');
document.addEventListener('click', e => { if (e.target.id === 'exp') exportar(); });

/* ---------- Voz ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, active = false, rm = false, lock, vozIniciada = false;
async function wake() { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function ui() { const m = $('mic'); m.className = active ? (rm ? 'on' : 'wait') : ''; m.textContent = !active ? 'Activar micrófono' : rm ? 'Registrando: di "salida"' : 'En espera: di "ingresar"'; }
function setMode(v) { if (rm === v) return; rm = v; ui(); snd(v ? 'on' : 'off'); $('heard').textContent = v ? 'Registrando: di tus ventas. Di "salida" para parar.' : 'En espera: di "ingresar" para anotar.'; }
function handle(t) {
  const n = FlaquitaParser.norm(t);
  const ing = /\b(ingresar|ingreso)\b/.test(n), sal = /\b(salida|salir)\b/.test(n);
  const rest = n.replace(/\b(ingresar|ingreso|salida|salir)\b/g, ' ').replace(/\s+/g, ' ').trim();
  if (ing) setMode(true);
  if (rm && rest) anotar(rest);
  if (sal) setMode(false);
}
function startRec() {
  rec = new SR(); rec.lang = 'es-PE'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) { const t = e.results[i][0].transcript.replace(/\b(salsa|zarza)(s?)\b/gi, 'sarza$2'); $('heard').textContent = 'Escuché: "' + t + '"'; handle(t); } };
  rec.onend = () => { if (active) setTimeout(() => { try { startRec(); } catch (e) {} }, 300); };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    $('heard').textContent = 'Micrófono bloqueado (' + e.error + '). Usa la caja de texto.';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { active = false; rm = false; ui(); $('dic').focus(); }
  };
  rec.start();
}
$('mic').onclick = () => {
  if (!SR) { $('heard').textContent = 'Tu navegador no soporta voz. Usa Chrome en Android.'; return; }
  active = !active; rm = false; ui();
  if (active) { wake(); startRec(); $('heard').textContent = 'En espera: di "ingresar" para anotar.'; }
  else { try { rec.stop(); } catch (e) {} if (lock) lock.release(); }
};
document.addEventListener('visibilitychange', () => { if (active && document.visibilityState === 'visible') wake(); });
function iniciarVoz() {
  if (vozIniciada) return; vozIniciada = true;
  if (!SR) return;
  active = true; ui(); wake();
  try { startRec(); } catch (e) { active = false; ui(); }
  setTimeout(() => { ac(); if (AC && AC.state !== 'running' && !rm) $('heard').textContent = 'Toca la pantalla una vez para activar los sonidos.'; }, 1500);
  $('heard').textContent = 'En espera: di "ingresar" para anotar.';
}

if ('serviceWorker' in navigator) {
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!recargando) { recargando = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js?v=28').then(r => r.update()).catch(() => {});
}
init();
</script>
</body></html>
