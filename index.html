<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'S/ ' + Number(n).toFixed(2);
const LIMA = { timeZone: 'America/Lima' };
const hoyStr = () => new Date().toLocaleDateString('en-CA', LIMA);
const diasAtras = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString('en-CA', LIMA); };
const horaStr = iso => new Date(iso).toLocaleTimeString('es-PE', { ...LIMA, hour: '2-digit', minute: '2-digit' });
const fdate = f => new Date(f + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'short', day: 'numeric', month: 'short' });
const CATEG = { chicharron: 'Chicharrón', sarza: 'Sarza', combinado: 'Combinados', bebida: 'Bebidas', cerveza: 'Cervezas', otro: 'Otros' };
const METODOS = { efectivo: 'Efectivo', yape: 'Yape', plin: 'Plin', tarjeta: 'Tarjeta', transferencia: 'Transferencia' };

let sb = null, CAT = [], HOY = [], HIST = [], ingresando = false;

/* ---------- Sonidos ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type, g) { const a = ac(); if (!a) return; const o = a.createOscillator(), v = a.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(v); v.connect(a.destination); const s = a.currentTime + t0; v.gain.setValueAtTime(0.0001, s); v.gain.exponentialRampToValueAtTime(g || 0.5, s + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, s + d); o.start(s); o.stop(s + d + 0.02); }
function snd(k) { try {
  if (k === 'ok') { tone(880, 0, .1, 'square', .3); tone(1320, .11, .18, 'square', .3); navigator.vibrate && navigator.vibrate(60); }
  else if (k === 'err') { tone(200, 0, .3, 'sawtooth', .35); tone(150, .32, .3, 'sawtooth', .35); navigator.vibrate && navigator.vibrate([120, 60, 120]); }
  else if (k === 'on') { tone(660, 0, .1, 'sine', .5); tone(880, .11, .1, 'sine', .5); tone(1100, .22, .14, 'sine', .5); }
  else if (k === 'off') { tone(880, 0, .1, 'sine', .5); tone(660, .11, .1, 'sine', .5); tone(440, .22, .14, 'sine', .5); }
} catch (e) {} }

/* ---------- Login ---------- */
function setMsg(t) { $('loginMsg').textContent = t; }
function mostrarLogin() { $('app').hidden = true; $('login').hidden = false; }

async function entrar() {
  if (ingresando) return;
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || !password) { setMsg('Escribe tu correo y contraseña.'); return; }
  ingresando = true;
  setMsg('Ingresando…');
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { setMsg('No se pudo ingresar: ' + error.message); return; }
    await iniciarApp(data && data.user);
  } catch (e) {
    setMsg('Error de conexión: ' + (e.message || e));
  } finally {
    ingresando = false;
  }
}

async function cargarCarta() {
  let { data, error } = await sb.from('productos')
    .select('id,nombre,categoria,precio,controla_stock,stock,stock_minimo')
    .eq('activo', true).order('orden');
  if (error) {
    const r2 = await sb.from('productos').select('id,nombre,categoria,precio').eq('activo', true).order('orden');
    data = r2.data; error = r2.error;
  }
  if (error) { $('heard').textContent = 'Error cargando la carta: ' + error.message; return false; }
  CAT = data || [];
  return true;
}

let NOMBRES_RAPIDOS = null;
let SYNC_ESTADO = { ok: null, msg: '' };

async function cargarConfiguracionRapidos() {
  try {
    const { data, error } = await sb.from('configuracion')
      .select('valor')
      .eq('clave', 'botones_rapidos')
      .maybeSingle();
    if (error) {
      console.error('configuracion (leer):', error);
      SYNC_ESTADO = { ok: false, msg: 'No se pudo leer: ' + error.message };
    } else if (data && Array.isArray(data.valor)) {
      NOMBRES_RAPIDOS = data.valor;
      try { localStorage.setItem('flaquita_rapidos_v1', JSON.stringify(data.valor)); } catch (e) {}
      SYNC_ESTADO = { ok: true, msg: '' };
      return;
    } else {
      SYNC_ESTADO = { ok: false, msg: 'No hay fila botones_rapidos en la base' };
    }
  } catch (e) {
    console.error('configuracion (leer):', e);
    SYNC_ESTADO = { ok: false, msg: 'Error de conexión: ' + (e.message || e) };
  }
  NOMBRES_RAPIDOS = null;
}


async function cuentaEstaEliminada(email) {
  const mail = (email || '').toLowerCase().trim();
  if (!mail || !sb) return false;
  try {
    const { data } = await sb.from('configuracion')
      .select('valor')
      .eq('clave', 'usuarios_eliminados')
      .maybeSingle();
    if (data && Array.isArray(data.valor)) {
      return data.valor.map(x => String(x).toLowerCase().trim()).includes(mail);
    }
  } catch (e) {}
  return false;
}

async function iniciarApp(u) {
  const mail = (u && u.email || '').toLowerCase().trim();
  if (await cuentaEstaEliminada(mail)) {
    await sb.auth.signOut();
    mostrarLogin();
    setMsg('Tu cuenta fue eliminada por el administrador.');
    return;
  }
  const nombre = (u && u.user_metadata && u.user_metadata.nombre) || 'Nerida Vasquez';
  $('quien').textContent = nombre;
  $('linkAdmin').hidden = true;
  $('login').hidden = true; $('app').hidden = false;
  try {
    const { data: esAdm } = await sb.rpc('es_admin');
    $('linkAdmin').hidden = !esAdm;
  } catch (e) {}
  if (!(await cargarCarta())) return;
  await cargarConfiguracionRapidos();
  pintarRapidos();
  await cargarHoy();
  iniciarVoz();
}

async function init() {
  $('entrar').onclick = entrar;
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); entrar(); } });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('pass').focus(); } });
  if (CONFIG.url.includes('TU-PROYECTO') || typeof supabase === 'undefined') {
    $('login').hidden = false;
    setMsg('Falta configurar Supabase: revisa CONFIG en index.html (o no hay conexión a internet).');
    return;
  }
  sb = supabase.createClient(CONFIG.url, CONFIG.key);
  $('login').hidden = false;
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await iniciarApp(data.session.user);
  } catch (e) {}
}

$('salir').onclick = async () => { if (sb) await sb.auth.signOut(); location.reload(); };

/* ---------- Ventas ---------- */
async function cargarHoy() {
  const { data, error } = await sb.from('ventas')
    .select('id,hora,metodo_pago,total,estado,venta_detalles(cantidad,precio_unitario,productos(nombre,categoria))')
    .eq('fecha', hoyStr()).order('hora', { ascending: false });
  if (error) { $('heard').textContent = 'Error leyendo ventas: ' + error.message; return; }
  HOY = data; pintarHoy();
}

function esPlatoChicharron(d) {
  const c = catDeDetalle(d);
  if (c === 'bebida' || c === 'cerveza') return false;
  if (c === 'chicharron' || c === 'combinado') return true;
  const n = ((d.productos && d.productos.nombre) || '').toLowerCase();
  return /chicharr|combinad|taypa|porci|plato/.test(n);
}

function pintarPlatosHoy() {
  const box = $('platosHoy');
  if (!box) return;
  const validas = HOY.filter(v => v.estado === 'valida');
  let totalPlatos = 0;
  const porPlato = {};
  validas.forEach(v => (v.venta_detalles || []).forEach(d => {
    if (!esPlatoChicharron(d)) return;
    const q = Number(d.cantidad) || 0;
    const n = (d.productos && d.productos.nombre) || 'Plato';
    totalPlatos += q;
    porPlato[n] = (porPlato[n] || 0) + q;
  }));
  const desglose = Object.entries(porPlato).sort((a, b) => b[1] - a[1]);
  box.innerHTML = `
    <div class="platos-mini-top">
      <span>Platos de chicharrón vendidos hoy</span>
      <span class="platos-mini-badge">${totalPlatos} ${totalPlatos === 1 ? 'plato' : 'platos'}</span>
    </div>
    ${desglose.length ? `<div class="platos-mini-tags">${desglose.map(([n, q]) => `<span class="platos-mini-tag"><b>${q}×</b> ${esc(n)}</span>`).join('')}</div>` : ''}
  `;
}

function pintarHoy() {
  const tot = HOY.filter(v => v.estado === 'valida').reduce((s, v) => s + Number(v.total), 0);
  $('tot').textContent = money(tot);
  pintarPlatosHoy();
  $('list').innerHTML = HOY.length ? HOY.map(v => {
    const controlMetodo = v.estado === 'valida'
      ? `<select class="mp-sel" data-vid="${v.id}" title="Cambiar método de pago">${Object.entries(METODOS).map(([k, lbl]) => `<option value="${k}"${v.metodo_pago === k ? ' selected' : ''}>${esc(lbl)}</option>`).join('')}</select>`
      : `<span>${esc(METODOS[v.metodo_pago] || v.metodo_pago)} · ANULADA</span>`;
    const barraAnular = v.estado === 'valida'
      ? `<div class="anul-bar" hidden>
           <span>¿Anular venta de ${horaStr(v.hora)} (${money(v.total)})?</span>
           <div style="display:flex;gap:6px">
             <button type="button" class="sm btn-anular-item" data-anular-id="${v.id}">Anular venta</button>
             <button type="button" class="sm btn-cancel-anular">Cancelar</button>
           </div>
         </div>`
      : '';
    return `
    <div class="card ${v.estado === 'anulada' ? 'anul' : ''}" ${v.estado === 'valida' ? `data-card-vid="${v.id}"` : ''}>
      <div class="vh"><b>${horaStr(v.hora)}</b>${controlMetodo}<b>${money(v.total)}</b></div>
      ${v.venta_detalles.map(d => `<div class="ln"><span>${d.cantidad} × ${esc(d.productos.nombre)}</span><span>${money(d.cantidad * d.precio_unitario)}</span></div>`).join('')}
      ${barraAnular}
    </div>`;
  }).join('') : '<p class="vacio">Aún no hay ventas hoy.</p>';
  if (!$('cierreBox').hidden) pintarCierreHoy();
}

async function anularVentaPorId(vid) {
  const v = HOY.find(x => x.id === Number(vid));
  const { error } = await sb.from('ventas').update({ estado: 'anulada' }).eq('id', Number(vid));
  if (error) { $('heard').textContent = 'No se pudo anular: ' + error.message; snd('err'); return; }
  $('heard').textContent = `Venta${v ? ' de las ' + horaStr(v.hora) + ' (' + money(v.total) + ')' : ''} anulada (el stock descontado fue devuelto).`;
  snd('ok');
  await cargarCarta();
  await cargarHoy();
}

let pressTimer = null, pressCard = null, pressX = 0, pressY = 0, pressMoved = false;
function limpiarPress() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (pressCard) { pressCard.classList.remove('pressing'); pressCard = null; }
}
function mostrarBarraAnular(card) {
  if (!card) return;
  card.classList.remove('pressing');
  $('list').querySelectorAll('.anul-bar').forEach(b => { b.hidden = true; });
  const bar = card.querySelector('.anul-bar');
  if (bar) {
    bar.hidden = false;
    try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) {}
    snd('off');
  }
  pressTimer = null;
  pressCard = null;
}
function iniciarPress(e, x, y) {
  if (e.target.closest('select, button, .anul-bar')) return;
  const card = e.target.closest('.card[data-card-vid]');
  if (!card) return;
  limpiarPress();
  pressCard = card;
  pressX = x;
  pressY = y;
  pressMoved = false;
  card.classList.add('pressing');
  pressTimer = setTimeout(() => mostrarBarraAnular(card), 1300);
}

$('list').addEventListener('selectstart', e => e.preventDefault());
$('list').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  iniciarPress(e, e.clientX, e.clientY);
});
$('list').addEventListener('mousemove', e => {
  if (!pressTimer) return;
  if (Math.abs(e.clientX - pressX) > 20 || Math.abs(e.clientY - pressY) > 20) { pressMoved = true; limpiarPress(); }
});
window.addEventListener('mouseup', limpiarPress);

$('list').addEventListener('touchstart', e => {
  const t = e.touches && e.touches[0];
  if (!t) return;
  iniciarPress(e, t.clientX, t.clientY);
}, { passive: true });
$('list').addEventListener('touchmove', e => {
  if (!pressTimer && !pressCard) return;
  const t = e.touches && e.touches[0];
  if (t && (Math.abs(t.clientX - pressX) > 20 || Math.abs(t.clientY - pressY) > 20)) { pressMoved = true; limpiarPress(); }
}, { passive: true });
$('list').addEventListener('touchend', limpiarPress);
$('list').addEventListener('contextmenu', e => {
  if (e.target.closest('select, button')) return;
  const card = e.target.closest('.card[data-card-vid]');
  if (card) {
    e.preventDefault();
    if (!pressMoved && !pressTimer) mostrarBarraAnular(card);
  }
});

$('list').addEventListener('click', e => {
  const btnAnular = e.target.closest('.btn-anular-item');
  if (btnAnular) {
    anularVentaPorId(btnAnular.dataset.anularId);
    return;
  }
  const btnCancel = e.target.closest('.btn-cancel-anular');
  if (btnCancel) {
    const bar = btnCancel.closest('.anul-bar');
    if (bar) bar.hidden = true;
  }
});

$('list').addEventListener('change', async e => {
  const sel = e.target.closest('.mp-sel');
  if (!sel) return;
  const vid = Number(sel.dataset.vid);
  const nuevo = sel.value;
  const v = HOY.find(x => x.id === vid);
  const anterior = v ? v.metodo_pago : null;
  sel.disabled = true;
  const { error } = await sb.from('ventas').update({ metodo_pago: nuevo }).eq('id', vid);
  sel.disabled = false;
  if (error) {
    if (anterior) sel.value = anterior;
    $('heard').textContent = 'No se pudo cambiar el método de pago: ' + error.message;
    snd('err');
    return;
  }
  if (v) v.metodo_pago = nuevo;
  if (!$('cierreBox').hidden) pintarCierreHoy();
  $('heard').textContent = `Pago cambiado a ${METODOS[nuevo] || nuevo}` + (v ? ` (${horaStr(v.hora)} · ${money(v.total)})` : '');
  snd('ok');
});

function porMetodo(vs) {
  const m = { efectivo: 0, yape: 0, plin: 0, tarjeta: 0, transferencia: 0 };
  vs.forEach(v => { m[v.metodo_pago] = (m[v.metodo_pago] || 0) + Number(v.total); });
  return m;
}

const DEFINICION_BLOQUES = [
  { key: 'comida',  titulo: 'Chicharrones, Combinados y Sarza', cls: 'c-comida',  color: '#be185d', cats: ['chicharron', 'combinado', 'sarza'] },
  { key: 'bebida',  titulo: 'Gaseosas, Chicha y Bebidas',       cls: 'c-bebida',  color: '#0284c7', cats: ['bebida'] },
  { key: 'cerveza', titulo: 'Cervezas',                         cls: 'c-cerveza', color: '#d97706', cats: ['cerveza'] },
  { key: 'otro',    titulo: 'Otros productos',                  cls: 'c-otro',    color: '#4b5563', cats: ['otro'] }
];

function catDeDetalle(d) {
  if (d.productos && d.productos.categoria) return d.productos.categoria;
  const p = CAT.find(x => x.nombre === (d.productos && d.productos.nombre));
  return (p && p.categoria) || 'otro';
}

function agruparPorBloques(vs) {
  const mapa = {};
  DEFINICION_BLOQUES.forEach(b => { mapa[b.key] = { ...b, unidades: 0, subtotal: 0, prods: {} }; });
  vs.forEach(v => (v.venta_detalles || []).forEach(d => {
    const c = catDeDetalle(d);
    const blk = DEFINICION_BLOQUES.find(b => b.cats.includes(c)) || DEFINICION_BLOQUES[3];
    const g = mapa[blk.key];
    const n = (d.productos && d.productos.nombre) || 'Producto';
    const sub = Number(d.cantidad) * Number(d.precio_unitario);
    g.unidades += Number(d.cantidad);
    g.subtotal += sub;
    if (!g.prods[n]) g.prods[n] = { q: 0, s: 0 };
    g.prods[n].q += Number(d.cantidad);
    g.prods[n].s += sub;
  }));
  return DEFINICION_BLOQUES.map(b => {
    const g = mapa[b.key];
    g.lista = Object.entries(g.prods).sort((a, x) => x[1].s - a[1].s);
    return g;
  });
}

function htmlBloquesCategoria(vs, totDia) {
  const bloques = agruparPorBloques(vs).filter(b => b.unidades > 0);
  if (!bloques.length) return '<p class="vacio" style="margin:6px 0">Sin productos registrados.</p>';
  const barra = totDia > 0 && bloques.length > 1
    ? `<div class="prop-bar" title="Proporción por categoría">${bloques.map(b => `<div style="width:${Math.max(3, Math.round(b.subtotal / totDia * 100))}%;background:${b.color}"></div>`).join('')}</div>`
    : '';
  return barra + bloques.map(b => {
    const pct = totDia > 0 ? Math.round(b.subtotal / totDia * 100) : 0;
    return `
      <div class="cat-box ${b.cls}">
        <div class="cat-head">
          <span>${esc(b.titulo)} <small>(${b.unidades} u.)</small></span>
          <span>${money(b.subtotal)} <small>${pct}%</small></span>
        </div>
        ${b.lista.map(([n, o]) => `<div class="ln" style="color:var(--fg)"><span><b>${o.q}</b> × ${esc(n)}</span><span>${money(o.s)}</span></div>`).join('')}
      </div>`;
  }).join('');
}

function textoResumenDia(fechaStr, vs) {
  const tot = vs.reduce((s, v) => s + Number(v.total), 0);
  const pm = porMetodo(vs);
  const bloques = agruparPorBloques(vs).filter(b => b.unidades > 0);
  const lineas = [
    `RESUMEN LA FLAQUITA - ${fdate(fechaStr).toUpperCase()} (${fechaStr})`,
    `Ventas válidas: ${vs.length} | Total: ${money(tot)}`,
    ''
  ];
  lineas.push('MÉTODOS DE PAGO:');
  Object.entries(pm).filter(([, val]) => val > 0).forEach(([k, val]) => {
    lineas.push(`- ${METODOS[k] || k}: ${money(val)}`);
  });
  bloques.forEach(b => {
    lineas.push('');
    lineas.push(`${b.titulo.toUpperCase()} (${b.unidades} u. · ${money(b.subtotal)}):`);
    b.lista.forEach(([n, o]) => {
      lineas.push(`- ${o.q} x ${n}: ${money(o.s)}`);
    });
  });
  return lineas.join('\n');
}

async function copiarTextoResumen(txt, btn) {
  try {
    await navigator.clipboard.writeText(txt);
    const prev = btn.textContent;
    btn.textContent = 'Copiado al portapapeles';
    snd('ok');
    setTimeout(() => { btn.textContent = prev; }, 2000);
  } catch (e) {
    $('heard').textContent = 'No se pudo copiar automáticamente.';
  }
}

let ultimaVentaId = null, ultimaVentaTs = 0;

async function guardar(items, rejects, metodoVoz) {
  const detalles = items.map(it => {
    const p = CAT.find(x => x.nombre === it.name);
    return p ? { producto_id: p.id, cantidad: it.q, precio_unitario: it.price } : null;
  }).filter(Boolean);
  if (!detalles.length) { $('heard').textContent = 'No se anotó nada' + (rejects.length ? ': ' + rejects.join(', ') : ''); snd('err'); return; }
  const metodoUsado = metodoVoz || $('metodo').value;
  try {
    const { data: id, error } = await sb.rpc('registrar_venta', { p_items: detalles, p_metodo_pago: metodoUsado, p_canal: 'local' });
    if (error) throw error;
    ultimaVentaId = id;
    ultimaVentaTs = Date.now();
    await cargarCarta();
    const avisosStock = [];
    const vistos = new Set();
    for (const it of items) {
      if (vistos.has(it.name)) continue;
      vistos.add(it.name);
      const p = CAT.find(x => x.nombre === it.name);
      if (p && p.controla_stock) {
        if (p.stock <= 0) avisosStock.push(`Sin stock de ${p.nombre} (queda ${p.stock})`);
        else if (p.stock <= (p.stock_minimo || 0)) avisosStock.push(`Stock bajo de ${p.nombre} (quedan ${p.stock})`);
      }
    }
    const resumen = items.map(i => `${i.q}× ${i.name} (${money(i.q * i.price)})`).join(', ');
    $('heard').textContent = `Venta #${id} (${METODOS[metodoUsado] || metodoUsado}): ${resumen}`
      + (avisosStock.length ? ' · Aviso: ' + avisosStock.join(', ') : '')
      + (rejects.length ? ` · No anoté: ${rejects.join(', ')}` : '');
    snd(rejects.length ? 'err' : 'ok');
    await cargarHoy();
  } catch (e) {
    $('heard').textContent = 'No se guardó: ' + e.message;
    snd('err');
  }
}

async function anotar(txt) {
  const r = FlaquitaParser.parseVenta(txt, CAT);
  if (!r.items.length) {
    if (r.metodo && !r.rejects.length) {
      if (ultimaVentaId && Date.now() - ultimaVentaTs < 25000) {
        const { error } = await sb.from('ventas').update({ metodo_pago: r.metodo }).eq('id', ultimaVentaId);
        if (!error) {
          $('heard').textContent = `Venta #${ultimaVentaId} cambiada a pago con ${METODOS[r.metodo] || r.metodo}.`;
          snd('ok');
          await cargarHoy();
          return;
        }
      }
      $('metodo').value = r.metodo;
      $('heard').textContent = `Método de pago seleccionado: ${METODOS[r.metodo] || r.metodo}.`;
      snd('ok');
      return;
    }
    $('heard').textContent = 'No entendí: "' + txt + '"' + (r.rejects.length ? ' · ' + r.rejects.join(', ') : '');
    snd('err');
    return;
  }
  return guardar(r.items, r.rejects, r.metodo);
}

$('go').onclick = () => { const v = $('dic').value.trim(); if (v) { anotar(v); $('dic').value = ''; } };
$('dic').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').onclick(); });

const RAPIDOS_DEFAULT = [
  'Combinado Taypa',
  'Combinado Taypa con sarza',
  'Combinado Normal',
  'Porción de chicharrón',
  'Media porción'
];
let editandoRapidos = false;

function obtenerNombresRapidos() {
  if (Array.isArray(NOMBRES_RAPIDOS) && NOMBRES_RAPIDOS.length) {
    const validos = NOMBRES_RAPIDOS.filter(n => CAT.some(p => p.nombre === n));
    if (validos.length) return validos;
  }
  try {
    const guardado = JSON.parse(localStorage.getItem('flaquita_rapidos_v1') || 'null');
    if (Array.isArray(guardado) && guardado.length) {
      const validos = guardado.filter(n => CAT.some(p => p.nombre === n));
      if (validos.length) return validos;
    }
  } catch (e) {}
  const def = RAPIDOS_DEFAULT.filter(n => CAT.some(p => p.nombre === n));
  return def.length ? def : CAT.filter(p => p.categoria === 'chicharron' || p.categoria === 'combinado').slice(0, 5).map(p => p.nombre);
}

async function guardarNombresRapidos(lista) {
  NOMBRES_RAPIDOS = lista;
  try { localStorage.setItem('flaquita_rapidos_v1', JSON.stringify(lista)); } catch (e) {}
  if (!sb) return false;
  try {
    const { data, error } = await sb.from('configuracion')
      .upsert({ clave: 'botones_rapidos', valor: lista, actualizado: new Date().toISOString() }, { onConflict: 'clave' })
      .select('valor');
    if (error) throw error;
    if (!data || !data.length) throw new Error('la base no aceptó el cambio (revisa permisos RLS de la tabla configuracion)');
    SYNC_ESTADO = { ok: true, msg: '' };
    return true;
  } catch (e) {
    console.error('configuracion (guardar):', e);
    SYNC_ESTADO = { ok: false, msg: 'No se guardó en la base: ' + (e.message || e) };
    $('heard').textContent = '⚠ ' + SYNC_ESTADO.msg + ' · solo quedó en este dispositivo.';
    snd('err');
    return false;
  }
}

      <div class="rap-edit-row" data-rap-card="${p.id}">
        <input type="text" data-edit-nombre="${p.id}" value="${esc(p.nombre)}" title="Nombre del producto">
        <input type="number" step="0.50" min="0" data-edit-precio="${p.id}" value="${Number(p.precio).toFixed(2)}" title="Precio S/">
        <button type="button" class="sm" data-rap-save="${p.id}" data-old-name="${esc(p.nombre)}" style="background:var(--ac);color:#fff;border-color:var(--ac)">Guardar</button>
        <button type="button" class="sm" data-rap-up="${idx}" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="sm" data-rap-dn="${idx}" ${idx === prodsRapidos.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="sm" data-rap-del="${esc(p.nombre)}" style="color:#b91c1c;border-color:#fca5a5">Quitar</button>
      </div>
    `).join('')}

    ${disponibles.length ? `
      <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)">
        <div style="font-size:12px;font-weight:700;color:var(--blk);margin-bottom:4px">Agregar producto de la carta a esta lista rápida</div>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="selAddRapido" style="margin:0;padding:8px;font-size:13px;flex:1">
            ${disponibles.map(p => `<option value="${esc(p.nombre)}">${esc(p.nombre)} (${money(p.precio)})</option>`).join('')}
          </select>
          <button type="button" class="sm" id="btnAddRapidoExistente" style="flex:0 0 auto;padding:8px 12px">+ Agregar</button>
        </div>
      </div>
    ` : ''}

    <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)">
      <div style="font-size:12px;font-weight:700;color:var(--blk);margin-bottom:4px">Crear nuevo producto rápido</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <input type="text" id="nrNombre" placeholder="Nombre (ej: Chicharrón de 18)" style="flex:2;min-width:140px;margin:0;padding:8px;font-size:13px">
        <select id="nrCat" style="flex:1;min-width:110px;margin:0;padding:8px;font-size:13px">
          <option value="combinado">Combinados</option>
          <option value="chicharron">Chicharrón</option>
          <option value="bebida">Bebidas</option>
          <option value="cerveza">Cervezas</option>
          <option value="sarza">Sarza</option>
          <option value="otro">Otros</option>
        </select>
        <input type="number" id="nrPrecio" step="0.50" min="0" placeholder="Precio S/" style="width:90px;margin:0;padding:8px;font-size:13px">
        <button type="button" class="sm" id="btnCrearRapidoNuevo" style="flex:1 1 100%;background:var(--blk);color:#fff;border-color:var(--blk);padding:9px">+ Crear y añadir a botones rápidos</button>
      </div>
    </div>
  `;
}

$('rapidos').onclick = async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.rapToggle) {
    editandoRapidos = !editandoRapidos;
    pintarRapidos();
    return;
  }

  if (btn.dataset.rapReset) {
    await guardarNombresRapidos(RAPIDOS_DEFAULT);
    pintarRapidos();
    $('heard').textContent = 'Botones rápidos restaurados a los 5 principales.';
    return;
  }

  if (btn.dataset.n) {
    const n = btn.dataset.n;
    const q = parseInt(btn.dataset.q || '1', 10) || 1;
    const p = CAT.find(x => x.nombre === n);
    if (p) guardar([{ name: p.nombre, q, price: Number(p.precio) }], []);
    return;
  }

  if (btn.dataset.rapUp !== undefined) {
    const idx = Number(btn.dataset.rapUp);
    const lista = obtenerNombresRapidos();
    if (idx > 0) {
      [lista[idx - 1], lista[idx]] = [lista[idx], lista[idx - 1]];
      await guardarNombresRapidos(lista);
      pintarRapidos();
    }
    return;
  }

  if (btn.dataset.rapDn !== undefined) {
    const idx = Number(btn.dataset.rapDn);
    const lista = obtenerNombresRapidos();
    if (idx < lista.length - 1) {
      [lista[idx + 1], lista[idx]] = [lista[idx], lista[idx + 1]];
      await guardarNombresRapidos(lista);
      pintarRapidos();
    }
    return;
  }

  if (btn.dataset.rapDel) {
    const quitar = btn.dataset.rapDel;
    const lista = obtenerNombresRapidos().filter(x => x !== quitar);
    if (!lista.length) { $('heard').textContent = 'Debe quedar al menos 1 botón rápido.'; return; }
    await guardarNombresRapidos(lista);
    pintarRapidos();
    return;
  }

  if (btn.id === 'btnAddRapidoExistente') {
    const sel = $('selAddRapido');
    if (!sel || !sel.value) return;
    const lista = obtenerNombresRapidos();
    if (!lista.includes(sel.value)) {
      lista.push(sel.value);
      await guardarNombresRapidos(lista);
      pintarRapidos();
    }
    return;
  }

  if (btn.dataset.rapSave) {
    const id = Number(btn.dataset.rapSave);
    const oldName = btn.dataset.oldName;
    const row = btn.closest('[data-rap-card]');
    const nuevoNombre = (row.querySelector('[data-edit-nombre]').value || '').trim();
    const nuevoPrecio = parseFloat(row.querySelector('[data-edit-precio]').value);
    if (!nuevoNombre || Number.isNaN(nuevoPrecio) || nuevoPrecio < 0) {
      $('heard').textContent = 'Indica un nombre y precio válidos.';
      snd('err');
      return;
    }
    btn.disabled = true;
    btn.textContent = '…';
    const { error } = await sb.from('productos').update({ nombre: nuevoNombre, precio: nuevoPrecio }).eq('id', id);
    btn.disabled = false;
    btn.textContent = 'Guardar';
    if (error) {
      $('heard').textContent = 'No se pudo editar (requiere cuenta Admin): ' + error.message;
      snd('err');
      return;
    }
    const lista = obtenerNombresRapidos().map(x => x === oldName ? nuevoNombre : x);
    await cargarCarta();
    await guardarNombresRapidos(lista);
    pintarRapidos();
    $('heard').textContent = `Actualizado: ${nuevoNombre} (${money(nuevoPrecio)})`;
    snd('ok');
    return;
  }

  if (btn.id === 'btnCrearRapidoNuevo') {
    const nombre = ($('nrNombre').value || '').trim();
    const categoria = $('nrCat').value;
    const precio = parseFloat($('nrPrecio').value);
    if (!nombre || Number.isNaN(precio) || precio < 0) {
      $('heard').textContent = 'Escribe el nombre y el precio del nuevo producto.';
      snd('err');
      return;
    }
    if (CAT.some(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
      const ex = CAT.find(p => p.nombre.toLowerCase() === nombre.toLowerCase());
      const lista = obtenerNombresRapidos();
      if (!lista.includes(ex.nombre)) lista.push(ex.nombre);
      await guardarNombresRapidos(lista);
      pintarRapidos();
      $('heard').textContent = `"${ex.nombre}" ya existía en la carta y fue añadido a los botones rápidos.`;
      snd('ok');
      return;
    }
    const maxOrden = CAT.reduce((m, p) => Math.max(m, Number(p.orden) || 0), 0);
    btn.disabled = true;
    btn.textContent = 'Creando…';
    const { error } = await sb.from('productos').insert({
      nombre,
      categoria,
      precio,
      activo: true,
      visible_web: true,
      controla_stock: (categoria === 'bebida' || categoria === 'cerveza'),
      stock: 0,
      stock_minimo: (categoria === 'bebida' || categoria === 'cerveza') ? 6 : 0,
      orden: maxOrden + 10
    });
    btn.disabled = false;
    btn.textContent = '+ Crear y añadir a botones rápidos';
    if (error) {
      $('heard').textContent = 'No se pudo crear en la base de datos: ' + error.message;
      snd('err');
      return;
    }
    const lista = obtenerNombresRapidos();
    await cargarCarta();
    lista.push(nombre);
    await guardarNombresRapidos(lista);
    pintarRapidos();
    $('heard').textContent = `Nuevo botón rápido creado: ${nombre} (${money(precio)})`;
    snd('ok');
  }
};

$('undo').onclick = async () => {
  const v = HOY.find(x => x.estado === 'valida');
  if (!v) { $('heard').textContent = 'No hay ventas válidas hoy.'; return; }
  if (!confirm(`¿Anular la venta de las ${horaStr(v.hora)} por ${money(v.total)}?`)) return;
  const { error } = await sb.from('ventas').update({ estado: 'anulada' }).eq('id', v.id);
  if (error) { $('heard').textContent = 'No se pudo anular: ' + error.message; return; }
  $('heard').textContent = 'Venta anulada (el stock descontado fue devuelto).';
  await cargarCarta();
  await cargarHoy();
};

/* ---------- Voz ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, active = false, rm = false, lock, vozIniciada = false;
async function wake() { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function ui() { const m = $('mic'); m.className = active ? (rm ? 'on' : 'wait') : ''; m.textContent = !active ? 'Activar micrófono' : rm ? 'Registrando: di "salida"' : 'En espera: di "ingresar"'; }
function setMode(v) { if (rm === v) return; rm = v; ui(); snd(v ? 'on' : 'off'); $('heard').textContent = v ? 'Registrando: di tus ventas. Di "salida" para parar.' : 'En espera: di "ingresar" para anotar.'; }
function handle(t) {
  const n = FlaquitaParser.norm(t);
  const ing = /\b(ingresar|ingreso)\b/.test(n), sal = /\b(salida|salir)\b/.test(n);
  const rest = n.replace(/\b(ingresar|ingreso|salida|salir)\b/g, ' ').replace(/\s+/g, ' ').trim();
  if (ing) setMode(true);
  if (rm && rest) anotar(rest);
  if (sal) setMode(false);
}
function startRec() {
  rec = new SR(); rec.lang = 'es-PE'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) { const t = e.results[i][0].transcript.replace(/\b(salsa|zarza)(s?)\b/gi, 'sarza$2'); $('heard').textContent = 'Escuché: "' + t + '"'; handle(t); } };
  rec.onend = () => { if (active) setTimeout(() => { try { startRec(); } catch (e) {} }, 300); };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    $('heard').textContent = 'Micrófono bloqueado (' + e.error + '). Usa la caja de texto.';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { active = false; rm = false; ui(); $('dic').focus(); }
  };
  rec.start();
}
$('mic').onclick = () => {
  if (!SR) { $('heard').textContent = 'Tu navegador no soporta voz. Usa Chrome en Android.'; return; }
  active = !active; rm = false; ui();
  if (active) { wake(); startRec(); $('heard').textContent = 'En espera: di "ingresar" para anotar.'; }
  else { try { rec.stop(); } catch (e) {} if (lock) lock.release(); }
};
document.addEventListener('visibilitychange', () => { if (active && document.visibilityState === 'visible') wake(); });
function iniciarVoz() {
  if (vozIniciada) return; vozIniciada = true;
  if (!SR) return;
  active = true; ui(); wake();
  try { startRec(); } catch (e) { active = false; ui(); }
  setTimeout(() => { ac(); if (AC && AC.state !== 'running' && !rm) $('heard').textContent = 'Toca la pantalla una vez para activar los sonidos.'; }, 1500);
  $('heard').textContent = 'En espera: di "ingresar" para anotar.';
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && sb && !$('app').hidden) {
    try {
      const { data } = await sb.auth.getUser();
      if (data && data.user && (await cuentaEstaEliminada(data.user.email))) {
        await sb.auth.signOut();
        location.reload();
        return;
      }
    } catch (e) {}
    if (!editandoRapidos) {
      cargarConfiguracionRapidos().then(() => pintarRapidos());
    }
  }
});

if ('serviceWorker' in navigator) {
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!recargando) { recargando = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js?v=34').then(r => r.update()).catch(() => {});
}

init();
</script>
